name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, testes e auditoria
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: senha-apenas-do-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psenha-apenas-do-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      # Actions fixadas por commit (as tags podem ser movidas).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test
        env:
          TEST_MYSQL_HOST: 127.0.0.1
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: senha-apenas-do-ci
          TEST_MYSQL_DATABASE: doctors_health_teste

      - run: npm audit --omit=dev --audit-level=high
